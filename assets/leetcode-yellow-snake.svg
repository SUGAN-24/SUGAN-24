  <path d="M72 82 H265 Q300 82 300 115 Q300 145 335 145 H470 Q505 145 505 112 Q505 80 540 80 H675 Q710 80 710 112 Q710 145 745 145 H830 Q870 145 870 108 Q870 78 900 78" fill="none" stroke="#A16207" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" opacity=".3"/>
  <path d="M72 82 H265 Q300 82 300 115 Q300 145 335 145 H470 Q505 145 505 112 Q505 80 540 80 H675 Q710 80 710 112 Q710 145 745 145 H830 Q870 145 870 108 Q870 78 900 78" fill="none" stroke="url(#gold)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
