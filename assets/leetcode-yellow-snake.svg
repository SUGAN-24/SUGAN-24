<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190" role="img" aria-labelledby="title desc">
  <title id="title">Golden LeetCode snake</title>
  <desc id="desc">A decorative golden snake winding through glowing coding-style squares.</desc>
  <defs>
