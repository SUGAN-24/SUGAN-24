    <rect x="218" y="112" width="18" height="18" rx="3"/><rect x="244" y="112" width="18" height="18" rx="3"/>
    <rect x="270" y="112" width="18" height="18" rx="3"/><rect x="296" y="112" width="18" height="18" rx="3"/>
    <rect x="322" y="112" width="18" height="18" rx="3"/><rect x="348" y="112" width="18" height="18" rx="3"/>
