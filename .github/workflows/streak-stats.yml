name: Update self-hosted GitHub streak card

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/streak-stats.yml"

permissions:
  contents: write

concurrency:
  group: streak-stats
  cancel-in-progress: true

jobs:
  update-streak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate streak SVG locally
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=SUGAN-24&theme=tokyonight&hide_border=true&disable_animations=true
          path: profile/streak.svg

      - name: Commit updated streak card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          if git diff --cached --quiet; then
            echo "Streak card is already up to date."
            exit 0
          fi
          git commit -m "Update self-hosted streak card"
          git push
