name: Generate contribution trail

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */12 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: contribution-trail
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate neon lime contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: SUGAN-24
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=%23A3E635&color_dots=%230B1020,%2314332B,%232D6A4F,%2365A30D,%23BEF264
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23BEF264&color_dots=%230B1020,%2314332B,%232D6A4F,%2365A30D,%23A3E635
            dist/github-contribution-grid-snake-light.svg?palette=github&color_snake=%2365A30D&color_dots=%23F7FEE7,%23D9F99D,%23BEF264,%2384CC16,%234D7C0F

      - name: Publish SVG animation to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
