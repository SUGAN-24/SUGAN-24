name: Generate contribution trail

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */12 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: contribution-trail
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate neon aurora contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: SUGAN-24
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=%23A78BFA&color_dots=%230B1020,%2318274A,%230E7490,%2306B6D4,%2367E8F9
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2367E8F9&color_dots=%230B1020,%2318274A,%23312581,%230E7490,%2322D3EE
            dist/github-contribution-grid-snake-light.svg?palette=github&color_snake=%237C3AED&color_dots=%23EDE9FE,%23DDD6FE,%23A5F3FC,%230E7490,%2306B6D4

      - name: Publish SVG animation to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
