name: Generate golden yellow contribution trail

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

concurrency:
  group: contribution-trail
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate golden yellow contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: SUGAN-24
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=%23FACC15&color_dots=%23050816,%23422006,%23854D0E,%23CA8A04,%23FDE047
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23FDE047&color_dots=%23050816,%23422006,%23854D0E,%23CA8A04,%23FACC15
            dist/github-contribution-grid-snake-light.svg?palette=github&color_snake=%23CA8A04&color_dots=%23FEFCE8,%23FEF08A,%23FDE047,%23EAB308,%23A16207

      - name: Publish SVG animation to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
